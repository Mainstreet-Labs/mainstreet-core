[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
fs_permissions = [{ access = "read-write", path = "./deployments/"}]
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200

[etherscan]
# This maps chain ID directly to the API key and URL
14601 = { key = "${ETHERSCAN_API_KEY}", url = "https://api-testnet.sonicscan.org/api" }
146 = { key = "${ETHERSCAN_API_KEY}", url = "https://api.sonicscan.org/api" }

[lint]
exclude_lints = [
    "mixed-case-variable",
    "screaming-snake-case-constant",
    "mixed-case-function",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "pascal-case-struct",
    "asm-keccak256",
    "divide-before-multiply",
    "unsafe-typecast",
    "unused-import",
    "unaliased-plain-import",
    "unwrapped-modifier-logic",
    "named-struct-fields"
]